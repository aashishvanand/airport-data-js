name: Release and Publish
on:
  push:
    branches:
      - release
  workflow_dispatch: # Allow manual triggering

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Security Audit
        run: npm audit --audit-level=high
      
      - name: Check for duplicate airport codes
        run: npm run check:duplicates
      
      - name: Run tests
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/release'
    permissions:
      contents: write
      id-token: write # For provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check for duplicate airport codes
        run: npm run check:duplicates
      
      - name: Run tests
        run: npm test
      
      - name: Check if version already published
        id: check-version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view airport-data-js version 2>/dev/null || echo "0.0.0")
          echo "package-version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "npm-version=$NPM_VERSION" >> $GITHUB_OUTPUT
          if [ "$PACKAGE_VERSION" != "$NPM_VERSION" ]; then
            echo "should-publish=true" >> $GITHUB_OUTPUT
          else
            echo "should-publish=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Publish to NPM
        if: steps.check-version.outputs.should-publish == 'true'
        run: npm publish --provenance
      
      - name: Extract latest changelog
        if: steps.check-version.outputs.should-publish == 'true'
        run: npm run --silent changelog:extract > "$RUNNER_TEMP/release-notes.md"
      
      - name: Create GitHub Release
        if: steps.check-version.outputs.should-publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.check-version.outputs.package-version }}
        run: |
          gh release create "v$PACKAGE_VERSION" \
            --title "Release v$PACKAGE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      
      - name: Skip publish (version unchanged)
        if: steps.check-version.outputs.should-publish == 'false'
        run: |
          echo "Version ${{ steps.check-version.outputs.package-version }} is already published on NPM"
          echo "Skipping publish step"