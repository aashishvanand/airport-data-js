name: Weekly data refresh

# Pulls the latest OurAirports export, adds new scheduled-service airports and
# newly assigned IATA codes, fills city names, validates, and opens a PR.
# Note: PRs opened with GITHUB_TOKEN do not trigger other workflows, so the
# build and tests run here before the PR is opened.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      add:
        description: 'Extra IATA codes to add even without scheduled service (comma-separated, e.g. FSH,BZJ)'
        required: false
        default: ''

permissions: read-all

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh from OurAirports
        env:
          EXTRA_ADD: ${{ github.event.inputs.add }}
        run: |
          ARGS=(--write --summary "$RUNNER_TEMP/summary.md")
          if [ -n "$EXTRA_ADD" ]; then ARGS+=(--add "$EXTRA_ADD"); fi
          npm run refresh:data -- "${ARGS[@]}"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/airports.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dataset changes this week." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Regenerate, validate, build and test
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run generate:compressed
          npm run check:duplicates
          npm run build
          npm test

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="data/refresh-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/airports.json src/airports.data.json src/airports.lite.data.json
          git commit -m "chore(data): weekly OurAirports refresh $(date -u +%Y-%m-%d)"
          git push --force origin "$BRANCH"
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Generated by the weekly data refresh workflow. Review the IATA mismatches list before merging; those records are not changed automatically."
          } > "$RUNNER_TEMP/body.md"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(data): weekly OurAirports refresh $(date -u +%Y-%m-%d)" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
